name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.25.3

jobs:
  workspace:
    name: Workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            packages/scopedbexporter/go.sum
            services/api/go.sum

      - name: Verify gofmt
        run: |
          mapfile -t files < <(git ls-files '*.go' ':!:services/gateway/collector/_build/**')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "Unformatted Go files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Verify go work sync
        run: |
          go work sync
          git diff --exit-code -- go.work.sum

  go-test:
    name: Go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: workspace
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/scopedbexporter
          - services/api
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            ${{ matrix.module }}/go.sum

      - name: Verify go mod tidy
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...

  collector:
    name: Collector
    runs-on: ubuntu-latest
    needs:
      - workspace
      - go-test
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            packages/scopedbexporter/go.sum

      - name: Install OCB
        run: make build-ocb

      - name: Build collector
        run: make build

      - name: Validate demo collector config
        run: |
          TELESCOPE_SCOPEDB_ENDPOINT=https://scopedb.invalid \
          TELESCOPE_SCOPEDB_API_KEY=dummy \
          make validate

      - name: Validate deploy collector config
        run: |
          TELESCOPE_SCOPEDB_ENDPOINT=https://scopedb.invalid \
          TELESCOPE_SCOPEDB_API_KEY=dummy \
          make validate-deploy

      - name: Build Docker image
        run: make docker-build
