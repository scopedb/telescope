name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-checks:
    name: Go Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify gofmt
        run: |
          mapfile -t files < <(git ls-files '*.go' ':!:services/gateway/collector/_build/**')
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "Unformatted Go files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests
        run: go test ./...

  collector-build:
    name: Collector Build
    runs-on: ubuntu-latest
    needs: go-checks
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build Telescope
        run: make build

      - name: Validate demo collector config
        run: |
          TELESCOPE_SCOPEDB_ENDPOINT=https://scopedb.invalid \
          TELESCOPE_SCOPEDB_API_KEY=dummy \
          make validate

      - name: Validate deploy collector config
        run: |
          TELESCOPE_SCOPEDB_ENDPOINT=https://scopedb.invalid \
          TELESCOPE_SCOPEDB_API_KEY=dummy \
          make validate-deploy

      - name: Build Docker image
        run: make docker-build
