name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: ./.github/actions/setup-go-cache
      - run: mise run check
      - run: mise run test:race

  tests:
    name: Runtime and distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: ./.github/actions/setup-go-cache
      - run: mise run ci-runtime

  integration:
    name: ScopeDB integration
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: ./.github/actions/setup-go-cache
      - name: Run ScopeDB integration tests
        env:
          TELESCOPE_SCOPEDB_INTEGRATION_ENDPOINT: ${{ secrets.TELESCOPE_SCOPEDB_INTEGRATION_ENDPOINT }}
          TELESCOPE_SCOPEDB_INTEGRATION_API_KEY: ${{ secrets.TELESCOPE_SCOPEDB_INTEGRATION_API_KEY }}
          TELESCOPE_SCOPEDB_INTEGRATION_TENANT_ID: ${{ secrets.TELESCOPE_SCOPEDB_INTEGRATION_TENANT_ID }}
        run: mise run test-integration
