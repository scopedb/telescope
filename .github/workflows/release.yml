name: Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+*" ]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Dockerfile
      - .dockerignore
      - mise.toml
      - scripts/**
      - go.mod
      - go.sum
      - cmd/**
      - internal/**
      - scopedbexporter/**
      - deploy/**
      - docs/**
      - README.md
      - CONTRIBUTING.md
      - CHANGELOG.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Release checks
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - run: mise run check
      - run: mise run test:race
      - run: mise run ci-runtime

  release-image-dry-run:
    name: Release image dry run
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scopedb/telescope
          tags: |
            type=semver,pattern={{raw}}
            type=edge,branch=main
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
      - name: Build release artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: mise run artifacts
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: false
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

  release-ghcr:
    name: Publish release
    if: ${{ github.repository == 'scopedb/telescope' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required to create GitHub releases.
      packages: write # Required to publish images to GHCR.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/scopedb/telescope
          tags: |
            type=semver,pattern={{raw}}
            type=edge,branch=main
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
      - name: Build release artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: mise run artifacts
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
      - name: Publish GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          awk -v version="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; found = ($2 == version); next }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            --notes-file "$notes_file" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag
