name: Setup Go cache
description: Restore Go module and build caches after mise installs the toolchain.

runs:
  using: composite
  steps:
    - id: go
      shell: bash
      run: |
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
        echo "build-cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "module-cache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: |
          ${{ steps.go.outputs.build-cache }}
          ${{ steps.go.outputs.module-cache }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
