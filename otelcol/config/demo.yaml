extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  vendordb:
    endpoint: ${env:VENDOR_DB_ENDPOINT}
    path: /v1/ingest
    api_key: ${env:VENDOR_API_KEY}
    dataset: demo
    tables:
      logs: scopedb.otel.logs
      traces: scopedb.otel.traces
      metrics: scopedb.otel.metrics
    schema_version: v1
    compression: zstd
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 4
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [vendordb, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [vendordb, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [vendordb, debug]
