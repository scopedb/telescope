[header]
builtin = "Apache-2.0"

[files]
includes = [
  "**/*.go",
  "**/*.toml",
  "**/*.yaml",
  "**/*.yml",
  "**/Dockerfile",
  "**/Makefile",
]

[props]
copyright_owner = "ScopeDB, Inc."
inception_year = 2026

# Go build constraints may be preceded only by blank lines and line comments.
[[rules]]
filenames = [
  "client_integration_test.go",
  "queue_storage_other.go",
  "queue_storage_unix.go",
  "queue_storage_unix_test.go",
  "scopedb_integration_test.go",
]
style_out = "doubleslash"
styles_in = ["doubleslash", "slashstar"]
