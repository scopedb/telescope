services:
  scopedb-telescope:
    image: scopedb-telescope:0.1.0
    build:
      context: ../../..
      dockerfile: services/gateway/collector/Dockerfile
    restart: unless-stopped
    environment:
      TELESCOPE_SCOPEDB_ENDPOINT: ${TELESCOPE_SCOPEDB_ENDPOINT}
      TELESCOPE_SCOPEDB_API_KEY: ${TELESCOPE_SCOPEDB_API_KEY}
      TELESCOPE_OTLP_GRPC_ADDR: 0.0.0.0:${TELESCOPE_OTLP_GRPC_PORT:-4317}
      TELESCOPE_OTLP_HTTP_ADDR: 0.0.0.0:${TELESCOPE_OTLP_HTTP_PORT:-4318}
      TELESCOPE_HEALTH_ADDR: 0.0.0.0:${TELESCOPE_HEALTH_PORT:-13133}
    ports:
      - "${TELESCOPE_OTLP_GRPC_PORT:-4317}:${TELESCOPE_OTLP_GRPC_PORT:-4317}"
      - "${TELESCOPE_OTLP_HTTP_PORT:-4318}:${TELESCOPE_OTLP_HTTP_PORT:-4318}"
      - "${TELESCOPE_HEALTH_PORT:-13133}:${TELESCOPE_HEALTH_PORT:-13133}"
    volumes:
      - scopedb-telescope-queue:/var/lib/telescope-otelcol/queue

volumes:
  scopedb-telescope-queue:
