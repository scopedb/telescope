extensions:
  health_check:
    endpoint: ${env:TELESCOPE_HEALTH_ADDR}
  file_storage:
    directory: /tmp/telescope/queue
    create_directory: true

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: ${env:TELESCOPE_OTLP_GRPC_ADDR}
      http:
        endpoint: ${env:TELESCOPE_OTLP_HTTP_ADDR}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 8192

exporters:
  scopedb:
    endpoint: ${env:TELESCOPE_SCOPEDB_ENDPOINT}
    path: /v1/ingest
    api_key: ${env:TELESCOPE_SCOPEDB_API_KEY}
    dataset: demo
    tables:
      logs: scopedb.otel.logs
      traces: scopedb.otel.traces
      metrics: scopedb.otel.metrics
    schema_version: v1
    compression: zstd
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 4
      storage: file_storage
  debug:
    verbosity: basic

service:
  extensions: [health_check, file_storage]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [scopedb, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [scopedb, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [scopedb, debug]
