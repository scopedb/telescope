# Runtime options share this document with mappings. See docs/deployment.md.
# resources:
#   memory_limit_mib: 1500
# delivery:
#   queue:
#     type: file
#     directory: /var/lib/telescope/queue
# telemetry:
#   resource:
#     deployment.environment: ${env:DEPLOYMENT_ENVIRONMENT}
#   level: normal
#   otlp:
#     endpoint: https://metrics.example.com/v1/metrics
#     compression: gzip
#     headers:
#       Authorization: ${env:METRICS_AUTHORIZATION}

signals:
  # Remove this block to disable traces, or add logs/metrics blocks as needed.
  traces:
    table: scopedb.otel.traces
    mapping:
      start_timestamp: span.start_time
      end_timestamp: span.end_time
      trace_id: span.trace_id
      span_id: span.span_id
      parent_span_id: span.parent_span_id
      service:
        sources:
          - resource.attributes["service.name"]
          - resource.attributes["service"]
        default: unknown
        cast: string
      span_name: span.name
      span_kind: span.kind
      status_code: span.status.code
      duration_ns: span.duration_ns
