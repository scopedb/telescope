# Fly.io deploy config for the Slock-operated `slock-telescope` app.
#
# This file is the operational source-of-truth for the Slock deployment of
# Telescope. It is internal-only: OTLP and HTTP endpoints are reachable via
# the Fly private network (`<app>.internal`) or `flyctl proxy`. There is no
# `[[services]]` block on purpose -- the app must not be exposed publicly.
#
# Deploy:
#     flyctl deploy --app slock-telescope --config deploy/fly/slock-telescope.toml
#
# Secrets (managed via `flyctl secrets set`, not committed):
#     TELESCOPE_SCOPEDB_ENDPOINT
#     TELESCOPE_SCOPEDB_API_KEY

app = "slock-telescope"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  TELESCOPE_HTTP_ADDR = "0.0.0.0:8080"
  TELESCOPE_OTLP_GRPC_ADDR = "0.0.0.0:4317"
  TELESCOPE_OTLP_HTTP_ADDR = "0.0.0.0:4318"
  TELESCOPE_HEALTH_ADDR = "0.0.0.0:13133"
  TELESCOPE_QUEUE_DIR = "/var/lib/telescope/queue"

[[mounts]]
  source = "telescope_queue"
  destination = "/var/lib/telescope/queue"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Platform-level health check against the Telescope health server
# (`TELESCOPE_HEALTH_ADDR`). The endpoint is a catch-all; `/healthz` is the
# canonical path. `restart_limit = 5` avoids restart storms while still
# letting Fly recover from a wedged process: the queue dir is on a volume,
# so frequent restarts are expensive.
[checks]
  [checks.healthz]
    type = "http"
    port = 13133
    method = "get"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    restart_limit = 5
